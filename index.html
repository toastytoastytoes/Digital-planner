<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Due">
<meta name="theme-color" content="#1b2433">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231b2433'/%3E%3Ctext x='90' y='125' font-size='100' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3E7%3C/text%3E%3C/svg%3E">
<title>Due</title>
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#1b2433; --muted:#6b7589; --line:#dce1ea;
  --accent:#2f4bff; --soon:#c9650a; --late:#c62839; --ok:#2a8a5a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141d; --card:#192130; --ink:#e8ecf4; --muted:#8c97ab; --line:#27324a;
    --accent:#7d92ff; --soon:#f0a24a; --late:#ff6b7a; --ok:#5ccf98;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:700;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:24px}
input[type=text],input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;
  border-radius:10px;min-height:46px;cursor:pointer}
:root[data-theme="dark"] .add,.add{color:#fff}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
li.done{opacity:.55}
li.done .name{text-decoration:line-through}
.chk{width:28px;height:28px;accent-color:var(--ok);cursor:pointer}
.name{font-weight:600;word-break:break-word}
.date{color:var(--muted);font-size:14px}
.left{text-align:right;min-width:64px}
.num{display:block;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
.unit{font-size:13px;color:var(--muted)}
.soon .num{color:var(--soon)} .late .num{color:var(--late)} .ok .num{color:var(--ink)}
.fin .num{color:var(--ok)}
.del{grid-column:1/-1;justify-self:end;font:inherit;font-size:13px;color:var(--muted);
  background:none;border:0;padding:4px 0 0;cursor:pointer}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:26px 0 10px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
</style>
</head>
<body>
<main>
  <h1>Planner</h1>
  <p class="sub" id="summary"></p>

  <form id="f">
    <input type="text" id="name" placeholder="Assignment name" maxlength="120" required autocomplete="off">
    <input type="date" id="date" required aria-label="Due date">
    <button class="add" type="submit">Add assignment</button>
  </form>

  <ul id="open"></ul>
  <h2 id="doneHead" hidden>Completed</h2>
  <ul id="done"></ul>
</main>

<script>
const KEY = "due-assignments-v1";
let items = [];

function load(){
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ items = []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){}
}

function daysLeft(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const due = new Date(y, m-1, d);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((due - now) / 86400000);
}
function fmt(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function row(it){
  const n = daysLeft(it.date);
  let cls, num, unit;
  if (it.done){ cls="fin"; num="✓"; unit="done"; }
  else if (n < 0){ cls="late"; num=Math.abs(n); unit = Math.abs(n)===1 ? "day late" : "days late"; }
  else if (n === 0){ cls="late"; num="0"; unit="due today"; }
  else { cls = n <= 3 ? "soon" : "ok"; num=n; unit = n===1 ? "day left" : "days left"; }
  return `<li class="${it.done?"done":""} ${cls}" data-id="${it.id}">
    <input class="chk" type="checkbox" ${it.done?"checked":""} aria-label="Mark ${esc(it.name)} complete">
    <div><div class="name">${esc(it.name)}</div><div class="date">${fmt(it.date)}</div></div>
    <div class="left"><span class="num">${num}</span><span class="unit">${unit}</span></div>
    <button class="del" type="button">Delete</button>
  </li>`;
}

function render(){
  const open = items.filter(i=>!i.done).sort((a,b)=>a.date.localeCompare(b.date));
  const done = items.filter(i=>i.done).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById("open").innerHTML = open.length ? open.map(row).join("")
    : `<li class="empty" style="display:block">Nothing due. Add an assignment above.</li>`;
  document.getElementById("done").innerHTML = done.map(row).join("");
  document.getElementById("doneHead").hidden = !done.length;
  const late = open.filter(i=>daysLeft(i.date)<0).length;
  document.getElementById("summary").textContent =
    open.length ? `${open.length} to do` + (late ? `, ${late} overdue` : "") : "You’re all caught up.";
}

document.getElementById("f").addEventListener("submit", e=>{
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const date = document.getElementById("date").value;
  if(!name || !date) return;
  items.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, date, done:false});
  save(); render(); e.target.reset();
});

document.addEventListener("click", e=>{
  const li = e.target.closest("li[data-id]"); if(!li) return;
  const id = li.dataset.id;
  if (e.target.classList.contains("del")){
    items = items.filter(i=>i.id!==id); save(); render();
  }
});
document.addEventListener("change", e=>{
  if(!e.target.classList.contains("chk")) return;
  const id = e.target.closest("li").dataset.id;
  const it = items.find(i=>i.id===id); if(it){ it.done = e.target.checked; save(); render(); }
});

// Refresh the counts when the app comes back to the foreground (e.g. the next morning)
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) render(); });

load(); render();
</script>
</body>
</html>
